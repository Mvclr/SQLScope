name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm exec turbo run lint typecheck test build

  integration:
    name: Engine contract on PostgreSQL (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  stack:
    name: Full stack smoke test (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start
        run: docker compose up --detach --build --wait --wait-timeout 300
      - name: API is ready
        run: curl --fail --silent --show-error http://localhost:4000/health/ready
      - name: Pages render
        run: |
          for path in / /learn /learn/loja-online /build /import /monaco/vs/loader.js; do
            curl --fail --silent --show-error --output /dev/null "http://localhost:3000$path"
          done
      - name: A session runs SQL through the web proxy
        run: |
          curl --fail --silent --show-error -c jar -b jar -X POST http://localhost:3000/api/sessions > /dev/null
          curl --fail --silent --show-error -c jar -b jar -X POST \
            -H 'Content-Type: application/json' \
            -d '{"sql":"create table t (id int); insert into t values (1), (2); select count(*) from t"}' \
            http://localhost:3000/api/sessions/current/execute > result.json
          jq -e '[.statements[].status] == ["ok","ok","ok"]' result.json
          jq -e '.statements[2].output.rows == [["2"]]' result.json
          jq -e '.schema.changes[0].type == "table-created"' result.json
      - name: Sandbox cluster is isolated from the control database
        run: |
          if docker compose exec -T postgres-sandbox pg_isready -h postgres-control -t 3; then
            echo "::error::postgres-sandbox can reach postgres-control"
            exit 1
          fi
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down --volumes
