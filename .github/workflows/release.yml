name: Release images

# Builds the three runtime images and publishes them to GHCR for both architectures the
# deployment target may turn out to be: linux/amd64 (most VPS) and linux/arm64 (Ampere).
# Each architecture is built on a native runner — emulating a Next.js build under QEMU
# takes tens of minutes — and a manifest list then joins the two under one tag.
#
# The server never builds: it pulls these images through compose.prod.yaml.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: web, dockerfile: apps/web/Dockerfile, target: '' }
          - { name: api, dockerfile: apps/api/Dockerfile, target: runtime }
          - { name: api-migrate, dockerfile: apps/api/Dockerfile, target: migrate }
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      # GHCR rejects uppercase paths, and the owner here is not lowercase.
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.image.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One tag per architecture. The manifest job below is what produces the tags people
      # actually deploy; these stay behind as the per-architecture sources.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.platform.arch }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

  manifest:
    name: Manifest for ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [web, api, api-migrate]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name for us.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Join both architectures under one tag
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.image }}"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "$image:${{ github.sha }}-amd64" \
            "$image:${{ github.sha }}-arm64"

  smoke:
    # Proves the published artifact runs on both architectures, which is the whole point of
    # building it twice: the hosting decision stops blocking anything downstream.
    name: Published images boot on ${{ matrix.arch }}
    needs: manifest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the stack from the registry
        run: |
          {
            echo "SQLSCOPE_VERSION=sha-$(echo '${{ github.sha }}' | cut -c1-7)"
            echo "SESSION_SECRET=$(openssl rand -base64 32)"
            echo "WEB_PUBLIC_PORT=3000"
          } > .env
          docker compose -f compose.yaml -f compose.prod.yaml up --detach --wait --wait-timeout 300

      - name: API is ready
        run: curl --fail --silent --show-error http://localhost:4000/health/ready

      - name: A session runs SQL through the web proxy
        run: |
          curl --fail --silent --show-error -c jar -b jar -X POST http://localhost:3000/api/sessions > /dev/null
          curl --fail --silent --show-error -c jar -b jar -X POST \
            -H 'Content-Type: application/json' \
            -d '{"sql":"create table t (id int); insert into t values (1), (2); select count(*) from t"}' \
            http://localhost:3000/api/sessions/current/execute > result.json
          jq -e '[.statements[].status] == ["ok","ok","ok"]' result.json
          jq -e '.statements[2].output.rows == [["2"]]' result.json

      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.prod.yaml logs

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f compose.prod.yaml down --volumes
