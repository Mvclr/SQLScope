# Full stack: `docker compose up --build`. Networks follow docs/ARCHITECTURE.md:
# data services sit on internal networks with no route out, and the control database
# never shares a network with the sandbox cluster.

name: sqlscope

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_INTERNAL_URL: 'http://api:4000' }
    # The only public entry point: the browser reaches the API through /api on this origin.
    ports: ['3000:3000']
    networks: [public]
    depends_on:
      api: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: runtime }
    # Loopback only. Published publicly, anyone could forge X-Forwarded-For and dodge the
    # per-client limits, which trust the web proxy as the single hop in front.
    ports: ['127.0.0.1:4000:4000']
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: 1
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # No fallback on purpose: this service runs as NODE_ENV=production, and a secret from
      # the repository would let anyone forge signed cookies. Set it in .env (see .env.example).
      SESSION_SECRET: ${SESSION_SECRET:?defina um SESSION_SECRET forte no .env — veja .env.example}
      CONTROL_DATABASE_URL: postgres://sqlscope:${CONTROL_DB_PASSWORD:-sqlscope}@postgres-control:5432/sqlscope
      SANDBOX_DATABASE_URL: postgres://sqlscope_provisioner:${SANDBOX_PROVISIONER_PASSWORD:-sandbox-provisioner}@postgres-sandbox:5432/postgres
      REDIS_URL: redis://:${REDIS_PASSWORD:-sqlscope}@redis:6379
    networks: [public, control, sandbox]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres-sandbox: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Applies Prisma migrations to the control database, then exits.
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: migrate }
    environment:
      CONTROL_DATABASE_URL: postgres://sqlscope:${CONTROL_DB_PASSWORD:-sqlscope}@postgres-control:5432/sqlscope
    networks: [control]
    depends_on:
      postgres-control: { condition: service_healthy }

  postgres-control:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sqlscope
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD:-sqlscope}
      POSTGRES_DB: sqlscope
      # Read by the init script that gives the sandbox manager a database of its own.
      SANDBOX_MANAGER_DB_PASSWORD: ${SANDBOX_MANAGER_DB_PASSWORD:-sandbox-manager}
    volumes:
      - control-data:/var/lib/postgresql
      - ./infra/postgres-control:/docker-entrypoint-initdb.d:ro
    networks: [control]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sqlscope -d sqlscope']
      interval: 5s
      timeout: 3s
      retries: 10

  # T1: one database per session (ADR 0001). Disposable by design — no volume.
  postgres-sandbox:
    image: postgres:18-alpine
    # Settings a session role cannot SET for itself (ADR 0001). What it can SET, such as
    # work_mem, is bounded by the container limits below.
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - temp_file_limit=512MB
      - -c
      - log_min_error_statement=panic
    mem_limit: 1g
    cpus: 2
    pids_limit: 512
    environment:
      POSTGRES_PASSWORD: ${SANDBOX_SUPERUSER_PASSWORD:-sandbox-superuser}
      SANDBOX_PROVISIONER_PASSWORD: ${SANDBOX_PROVISIONER_PASSWORD:-sandbox-provisioner}
    volumes: [./infra/postgres-sandbox:/docker-entrypoint-initdb.d:ro]
    networks: [sandbox]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  # Owns the T2 sandbox containers (ADR 0002). No published port and no public network:
  # the API reaches it on "control" once a lab uses T2.
  sandbox-manager:
    build: { context: ., dockerfile: apps/sandbox-manager/Dockerfile }
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # No fallback, like SESSION_SECRET: whoever holds it can start containers on the host.
      SANDBOX_MANAGER_TOKEN: ${SANDBOX_MANAGER_TOKEN:?defina um SANDBOX_MANAGER_TOKEN forte no .env — veja .env.example}
      STATE_DATABASE_URL: postgres://sqlscope_sandbox_manager:${SANDBOX_MANAGER_DB_PASSWORD:-sandbox-manager}@postgres-control:5432/sqlscope_sandboxes
      DOCKER_HOST: http://docker-socket-proxy:2375
      MANAGER_INSTANCE: sqlscope
      # Empty until the API uses T2; then the API container joins every sandbox network.
      SANDBOX_ATTACH_CONTAINERS: ''
    networks: [control, docker-api]
    depends_on:
      postgres-control: { condition: service_healthy }
      docker-socket-proxy: { condition: service_healthy }

  # The Docker API with an allowlist: containers and networks, nothing else — no images,
  # no exec, no volumes (ADR 0002). The socket is root on the host; only this container
  # mounts it, and only the sandbox manager can reach this one.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 1
      ALLOW_START: 1
      EVENTS: 0
    volumes: ['/var/run/docker.sock:/var/run/docker.sock:ro']
    read_only: true
    tmpfs: [/run, /tmp]
    networks: [docker-api]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:2375/_ping | grep -q OK']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-sqlscope}', '--appendonly', 'no']
    networks: [control]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-sqlscope}

networks:
  public:
  control:
    internal: true
  sandbox:
    internal: true
  # Sandbox manager ↔ socket proxy, and nobody else: the API is not on it.
  docker-api:
    internal: true

volumes:
  control-data:
