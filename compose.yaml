# Full stack: `docker compose up --build`. Networks follow docs/ARCHITECTURE.md:
# data services sit on internal networks with no route out, and the control database
# never shares a network with the sandbox cluster.

name: sqlscope

services:
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ['3000:3000']
    networks: [public]
    depends_on:
      api: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    ports: ['4000:4000']
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONTROL_DATABASE_URL: postgres://sqlscope:${CONTROL_DB_PASSWORD:-sqlscope}@postgres-control:5432/sqlscope
      SANDBOX_DATABASE_URL: postgres://sqlscope_provisioner:${SANDBOX_PROVISIONER_PASSWORD:-sandbox-provisioner}@postgres-sandbox:5432/postgres
      REDIS_URL: redis://:${REDIS_PASSWORD:-sqlscope}@redis:6379
    networks: [public, control, sandbox]
    depends_on:
      postgres-control: { condition: service_healthy }
      postgres-sandbox: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres-control:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sqlscope
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD:-sqlscope}
      POSTGRES_DB: sqlscope
    volumes: [control-data:/var/lib/postgresql]
    networks: [control]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sqlscope -d sqlscope']
      interval: 5s
      timeout: 3s
      retries: 10

  # T1: one database per session (ADR 0001). Disposable by design — no volume.
  postgres-sandbox:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${SANDBOX_SUPERUSER_PASSWORD:-sandbox-superuser}
      SANDBOX_PROVISIONER_PASSWORD: ${SANDBOX_PROVISIONER_PASSWORD:-sandbox-provisioner}
    volumes: [./infra/postgres-sandbox:/docker-entrypoint-initdb.d:ro]
    networks: [sandbox]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-sqlscope}', '--appendonly', 'no']
    networks: [control]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-sqlscope}

networks:
  public:
  control:
    internal: true
  sandbox:
    internal: true

volumes:
  control-data:
